# ~/.config/starship.toml

add_newline     = false
command_timeout = 1000

format = """$character$directory$git_branch$git_status$git_state"""

[character]
error_symbol   = '[ ➜](bold red)'
success_symbol = '[ ➜](bold green)'

[directory]
format            = '[$path]($style) '
home_symbol       = '~'
style             = 'bold cyan'
truncation_length = 3

# Git info uses starship's own modules. The previous `[custom.git_info]`
# block shelled out to `git symbolic-ref` + `git status --porcelain` on every
# prompt — the same six-fork pattern as the zsh prompt in config/zsh. These
# modules are built in and cached, so they cost no subprocesses.
#
# `$git_state` is appended so a rebase/merge in progress stays visible, which
# the old block silently dropped.
[git_branch]
format = '[git:(|$style|$branch)]($style) '
[git_status]
format = '([$all_status$ahead_behind]($style) )'
[git_state]
format = '[$state]($style) '
[package]
disabled = true
[nodejs]
disabled = true
[python]
disabled = true
[ruby]
disabled = true
[aws]
disabled = true
[docker_context]
disabled = true
[nix_shell]
disabled = true
