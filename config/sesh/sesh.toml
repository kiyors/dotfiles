#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

cache      = false
dir_length = 2

sort_order = [ "tmux", [ "config", "zoxide" ] ]

[default_session]
# Optional: Set a nice preview command for your session picker using eza and bat
preview_command = "eza --all --git --icons --color=always {}"

[tui]
group_separator = true
show_windows    = true

[[session]]
alias              = "df"
alias_auto_connect = true
name               = "dotfiles"
path               = "~/dotfiles"
windows            = [ "editor" ]

[[session]]
alias   = "nvim"
name    = "dotfiles/nvim"
path    = "~/dotfiles/config/nvim"
windows = [ "editor" ]

[[window]]
name           = "editor"
startup_script = "nvim"

[[session]]
name = "Downloads"
path = "~/Downloads"

[[session]]
name = "Documents"
path = "~/Documents"

[[session]]
alias = "ws"
name  = "workspace"
path  = "~/workspace"
