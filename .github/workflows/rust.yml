name: rust

on:
  push:
    paths:
      - "crates/**"
      - "pkgs/coffee.nix"
      - "pkgs/gitprompt.nix"
      - "modules/darwin/zombie-reaper.nix"
      - "config/zsh/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "crates/**"
      - "pkgs/coffee.nix"
      - "pkgs/gitprompt.nix"
      - "modules/darwin/zombie-reaper.nix"
      - "config/zsh/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"

# Both crates are members of a virtual workspace whose root manifest is two
# levels up, so every cargo command runs from the repository root with
# `--workspace` rather than from a member directory.
defaults:
  run:
    working-directory: .

jobs:
  check:
    # macOS, because the tests exercise real process tables, real volumes and
    # real launchd output. A Linux runner would silently skip most of that.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The Nix build runs `cargo test` via `doCheck`, but nothing runs fmt or
      # clippy anywhere. These two are what stops a warning reaching main.
      - name: Format
        run: cargo fmt --all --check

      # `--workspace` because these are members of a virtual workspace, and the
      # lint set lives in the root manifest rather than in a member's.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # `background_policy_matches_the_launchd_agent` reads
      # modules/darwin/zombie-reaper.nix via CARGO_MANIFEST_DIR. The checkout
      # provides that file here, but the Nix build sandbox does not — which is
      # why this module is in the path filter above.
      #
      # gitprompt's tests need `git` on PATH for the same reason: they build
      # real repositories, and without it every dirty-state test silently
      # returns early and passes without asserting anything.
      - name: Test
        run: cargo test --workspace
